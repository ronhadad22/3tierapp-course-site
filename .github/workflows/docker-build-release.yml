name: Docker Build and Release with Semantic Versioning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: codebuild-test-github-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10

  docker-build:
    name: Build and Push Docker Image
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: codebuild-test-github-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract version and metadata
        id: meta
        run: |
          VERSION=${{ needs.semantic-release.outputs.new_release_version }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=$(echo ${VERSION} | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo ${VERSION} | cut -d. -f1-2)" >> $GITHUB_OUTPUT
          
          # Convert repository name to lowercase for ghcr.io
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.minor }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.major }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.description=3-tier app course site
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      
      - name: Image summary
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "✅ Docker image pushed successfully to GitHub Container Registry!"
          echo ""
          echo "Image: ${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ steps.meta.outputs.version }}"
          echo ""
          echo "Available tags:"
          echo "  - ${{ steps.meta.outputs.version }} (full version)"
          echo "  - ${{ steps.meta.outputs.minor }} (major.minor)"
          echo "  - ${{ steps.meta.outputs.major }} (major)"
          echo "  - latest"
          echo ""
          echo "Pull command:"
          echo "  docker pull ${{ env.REGISTRY }}/${IMAGE_NAME_LOWER}:${{ steps.meta.outputs.version }}"

  summary:
    name: Deployment Summary
    needs: [semantic-release, docker-build]
    if: always()
    runs-on: codebuild-test-github-${{ github.run_id }}-${{ github.run_attempt }}
    
    steps:
      - name: Print summary
        run: |
          echo "=== Deployment Summary ==="
          echo ""
          if [ "${{ needs.semantic-release.outputs.new_release_published }}" == "true" ]; then
            IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            echo "✅ New release published: v${{ needs.semantic-release.outputs.new_release_version }}"
            echo "✅ Docker image built and pushed to GitHub Container Registry"
            echo ""
            echo "Image: ghcr.io/${IMAGE_NAME_LOWER}:${{ needs.semantic-release.outputs.new_release_version }}"
            echo ""
            echo "Pull command:"
            echo "  docker pull ghcr.io/${IMAGE_NAME_LOWER}:${{ needs.semantic-release.outputs.new_release_version }}"
            echo ""
            echo "View package: https://github.com/${{ github.repository }}/pkgs/container/$(basename ${{ github.repository }})"
          else
            echo "ℹ️  No new release - no version bump needed"
            echo "ℹ️  Commit message didn't trigger a release"
            echo ""
            echo "To trigger a release, use conventional commits:"
            echo "  - feat: new feature (minor version bump)"
            echo "  - fix: bug fix (patch version bump)"
            echo "  - BREAKING CHANGE: breaking change (major version bump)"
          fi

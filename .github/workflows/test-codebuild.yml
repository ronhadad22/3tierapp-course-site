name: Test CodeBuild Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-codebuild:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Print environment info
        run: |
          echo "=== Environment Information ==="
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Date: $(date)"
          echo "Working Directory: $(pwd)"
          echo ""
          echo "=== System Information ==="
          uname -a
          echo ""
          echo "=== Available Tools ==="
          node --version
          npm --version
          python3 --version
          docker --version
          git --version
          echo ""
          echo "=== AWS CLI ==="
          aws --version
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::950555670656:role/GitHubCodeBuildStack-GitHubActionsRole4F1BBA26-Vi0SJTAocFZk
          aws-region: us-east-2
      
      - name: Verify AWS Identity
        run: |
          echo "=== AWS Identity ==="
          aws sts get-caller-identity
          echo ""
          echo "=== S3 Buckets ==="
          aws s3 ls
      
      - name: Simple test
        run: |
          echo "=== Running Simple Test ==="
          echo "CodeBuild runner is working!"
          echo "This workflow ran successfully in AWS CodeBuild"
      
      - name: Test completion
        run: |
          echo "✅ All tests passed!"
          echo "CodeBuild integration is working correctly"
